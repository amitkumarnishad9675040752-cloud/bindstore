{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>{{ 'Sign Up' if mode == 'signup' else 'Login' }}</h2>
  <p class="desc">{{ 'Naya account banayein' if mode == 'signup' else 'Apne account me jayein' }}</p>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">{{ 'Create Account' if mode == 'signup' else 'Login' }}</button>
  </form>
  <p class="desc" style="margin-top:12px;text-align:center">
    {% if mode == 'signup' %}
      Pehle se account hai? <a href="/login" style="color:var(--accent)">Login</a>
    {% else %}
      Naya hai? <a href="/signup" style="color:var(--accent)">Sign Up</a>
    {% endif %}
  </p>
</div>
{% endblock %}
