{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Double Unsubscribe OTP Sender</h2>
  <p class="desc">Gmail: {{ gmail }}</p>
  <div class="result">
    {% if ok %}<div class="ok">✅ {{ msg }}</div>{% else %}<div class="bad">❌ {{ msg }}</div>{% endif %}
  </div>
  {% if ok and show_otp %}
  <form method="POST" action="/tool/otp">
    <input type="hidden" name="step" value="2">
    <label>Enter OTP (gmail par aaya hoga)</label>
    <input type="text" name="otp" required>
    <button class="btn" type="submit">Verify OTP</button>
  </form>
  {% endif %}
  <a class="btn ghost" href="/dashboard">← Dashboard</a>
</div>
{% endblock %}
